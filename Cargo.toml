[workspace]
members = [
    "crates/larksync-core",
    "crates/larksync-ffi",
]
resolver = "2"

[workspace.package]
version = "1.0.2"
edition = "2021"
authors = ["Witt Kung <witt.w.kung@gmail.com>"]
license = "BSD-3-Clause OR Apache-2.0"
repository = "https://github.com/KevinTungs/LarkSync"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
governor = "0.6"
nonzero_ext = "0.3"
pulldown-cmark = { version = "0.11", default-features = false, features = ["html"] }
similar = { version = "2.6", features = ["inline"] }
rusqlite = { version = "0.32", features = ["bundled", "blob"] }
zstd = "0.13"
tar = "0.4"
slotmap = "1.0"
blake3 = "1.5"
tracing = "0.1"
uniffi = { version = "0.28", default-features = false, features = ["cli", "tokio"] }
zeroize = { version = "1.8", features = ["derive", "alloc"] }
