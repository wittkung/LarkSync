name: Release Plugin Pipeline

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  lint-and-test:
    name: Lint, Tests & UniFFI Drift Check
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Rust Unit Tests
        run: cargo test --workspace --verbose

      - name: Verify UniFFI Bindings Drift
        run: |
          chmod +x scripts/generate-bindings.sh
          ./scripts/generate-bindings.sh
          git diff --exit-code apple/Sources/LarkSyncCore apple/Sources/larksync_ffiFFI || {
            echo "❌ [Error] UniFFI Swift bindings are out of sync!"
            exit 1
          }

  build-and-release:
    name: Build Universal Bundle & Sign Release
    needs: lint-and-test
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build & Package Plugin
        run: |
          chmod +x scripts/dev-release.sh scripts/build-plugin.sh scripts/generate-bindings.sh
          RAW_TAG="${GITHUB_REF_NAME#v}"
          [ -z "${RAW_TAG}" ] && RAW_TAG="${{ github.event.inputs.tag_name }}"
          RAW_TAG="${RAW_TAG#v}"
          
          ./scripts/dev-release.sh pack "${RAW_TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "LarkSync Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            dist/*.ttplugin.zip
            dist/*.sig
            dist/checksums.txt
